<body class="shop-page">
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="CoolestKidz">

    </div>

  <div class="nav-mobile" id="navMobile">
    <a href="index.html">Accueil</a>

    <a href="sous-marques.html">Sous-marques</a>

  </div>
  <main>
    <div class="container">
      <div class="shop-head">
        <h1>Contact</h1>
        <p>Commandes, tailles, partenariats.</p>
      </div>
      <div class="contact-grid" style="margin-bottom:64px">
        <div class="contact-info">
          <div class="contact-row"><label>WhatsApp</label>
            <a href="https://wa.me/237600000000" target="_blank" rel="noopener">+237 6XX XX XX XX</a></div>
          <div class="contact-row"><label>Email</label>
            <a href="mailto:contact@coolestkidz.cm">contact@coolestkidz.cm</a></div>
        </div>
        <form class="contact-form" id="contactForm" style="background:#fff;border:1px solid rgba(0,0,0,0.08)">
          <div class="form-row">
            <div class="field"><label>Nom</label><input name="name" required style="background:#fff;color:#111;border-color:#e8e8e6"></div>
            <div class="field"><label>Email</label><input type="email" name="email" required style="background:#fff;color:#111;border-color:#e8e8e6"></div>
          </div>
          <div class="field"><label>Message</label><textarea name="message" required style="background:#fff;color:#111;border-color:#e8e8e6"></textarea></div>
          <button type="submit" class="btn btn-red btn-full">Envoyer</button>
        </form>
      </div>
    </div></main>
  <footer class="footer">
